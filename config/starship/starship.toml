# Avoid prompt lag
command_timeout = 500

add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$python\
$golang\
$cmd_duration\
$line_break\
$character
"""

[directory]
style = "bold cyan"
read_only = " "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
disabled = false
format = '([\[$all_status$ahead_behind\]](red))'
conflicted = "⚔️ "
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
modified = "!"
staged = "+"
untracked = "?"

[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"